name: Nutmeg (J.P. Morgan Personal Investing)
description: >-
  Nutmeg is a UK digital wealth manager and robo-advisor founded in 2011 and acquired by
  JPMorgan Chase in 2021, now operating as J.P. Morgan Personal Investing. It offers consumer
  investment accounts including Stocks and Shares ISAs, Lifetime ISAs, Junior ISAs, personal
  pensions, and general investment accounts, with fully managed, Smart Alpha, socially
  responsible, thematic, fixed allocation, and income portfolio strategies plus free financial
  guidance and paid advice. Nutmeg is authorised and regulated by the UK Financial Conduct
  Authority (FCA register #552016). It is a consumer-facing wealth platform and does not
  publish a public developer API, OpenAPI specification, SDK, or developer portal.
